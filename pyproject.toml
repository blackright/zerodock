[project]
name = "zerodock"
version = "0.1.0"
description = "Zero-dependency, ultra-lightweight local execution engine for serverless cloud architectures."
authors = [{ name = "ZeroDock Contributors", email = "contributors@zerodock.dev" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["serverless", "aws-lambda", "local-development", "fastapi", "docker-compose"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/blackright/zerodock"
Documentation = "https://github.com/blackright/zerodock#readme"
Repository = "https://github.com/blackright/zerodock"
Issues = "https://github.com/blackright/zerodock/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
    'tomli>=1.1.0; python_version < "3.11"',
]

[project.scripts]
zerodock = "zerodock.cli:main"

[tool.poetry]
name = "zerodock"
version = "0.1.0"
description = "Zero-dependency, ultra-lightweight local execution engine for serverless cloud architectures."
authors = ["ZeroDock Contributors"]
readme = "README.md"
packages = [{ include = "zerodock", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pyyaml = "^6.0.1"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
tomli = { version = "^2.0.1", python = "<3.11" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
