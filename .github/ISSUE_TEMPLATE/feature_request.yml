name: Feature Request
description: Suggest an idea, enhancement, or new cloud simulation capability for ZeroDock
title: "[FEAT]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature for ZeroDock!
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or missing cloud capability?
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Feature Specification
      description: Describe the solution you'd like to see implemented.
      placeholder: Describe the architecture, API, or YAML configuration changes.
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: checkboxes
    id: contributors
    attributes:
      label: Contribution
      options:
        - label: I would be interested in submitting a Pull Request for this feature!
